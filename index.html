<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sohan Ahammad - Video Editor Portfolio</title>
    <meta name="description" content="Portfolio website of Sohan Ahammad, featuring video editing trailers, YouTube projects, graphic & poster designs, and contact information." />
    
    <!-- Open Graph / Facebook / Telegram / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sohan Ahammad | Video Editor" />
    <meta property="og:title" content="Sohan Ahammad - Video Editor Portfolio" />
    <meta property="og:description" content="Portfolio website of Sohan Ahammad, featuring video editing trailers, YouTube projects, graphic & poster designs, and contact information." />
    <meta property="og:image" content="/profile.jpg" />
    <meta property="og:image:secure_url" content="/profile.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sohan Ahammad - Video Editor Portfolio" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sohan Ahammad - Video Editor Portfolio" />
    <meta name="twitter:description" content="Portfolio website of Sohan Ahammad, featuring video editing trailers, YouTube projects, graphic & poster designs, and contact information." />
    <meta name="twitter:image" content="/profile.jpg" />

    <!-- Absolute Canonical & OpenGraph URL Resolver for Social Bots -->
    <script>
      (function() {
        try {
          var origin = window.location.origin;
          if (origin && origin.indexOf('http') === 0) {
            var fullUrl = origin + '/profile.jpg';
            var ogImg = document.querySelector('meta[property="og:image"]');
            if (ogImg) ogImg.setAttribute('content', fullUrl);
            var ogSec = document.querySelector('meta[property="og:image:secure_url"]');
            if (ogSec) ogSec.setAttribute('content', fullUrl);
            var twImg = document.querySelector('meta[name="twitter:image"]');
            if (twImg) twImg.setAttribute('content', fullUrl);
            var ogUrl = document.querySelector('meta[property="og:url"]');
            if (ogUrl) ogUrl.setAttribute('content', origin + '/');
          }
        } catch(e) {}
      })();
    </script>

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Sohan Ahammad",
      "jobTitle": "Video Editor & Visual Storyteller",
      "description": "Portfolio website of Sohan Ahammad, featuring video editing trailers, YouTube projects, graphic & poster designs, and contact information.",
      "image": "/profile.jpg"
    }
    </script>

    <link rel="icon" type="image/jpeg" href="/profile.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 transition-colors duration-300 antialiased selection:bg-amber-500 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
